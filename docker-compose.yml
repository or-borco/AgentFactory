services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentfactory
      POSTGRES_PASSWORD: agentfactory
      POSTGRES_DB: agentfactory
    ports:
      - "5432:5432"
    volumes:
      - agentfactory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfactory -d agentfactory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentfactory_pgdata:
